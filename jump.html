<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>正在打开… · 没啥用</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#070b18; --text:#eef2ff; --dim:#a9b3cc; --faint:#7c879f;
    --card:rgba(255,255,255,0.05); --stroke:rgba(255,255,255,0.12);
    --accent:#4f7cff; --accent2:#6a5cff;
  }
  html,body { min-height:100%; }
  body {
    background:
      radial-gradient(900px 600px at 20% -10%, rgba(79,124,255,0.25), transparent 60%),
      radial-gradient(800px 600px at 90% 10%, rgba(124,92,255,0.20), transparent 55%),
      linear-gradient(180deg, #070b18, #0b1122 60%, #070b18);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { width:100%; max-width:420px; }
  .back {
    display:inline-flex; align-items:center; gap:6px; margin-bottom:16px;
    color:var(--faint); text-decoration:none; font-size:13px; font-weight:600;
    padding:8px 12px; border-radius:999px; border:1px solid var(--stroke);
    background:var(--card);
  }
  .card {
    background:var(--card); border:1px solid var(--stroke);
    border-radius:24px; padding:26px 20px 22px; text-align:center;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 60px rgba(0,0,0,0.35);
  }
  .icon {
    width:76px; height:76px; border-radius:22px; margin:0 auto 18px;
    display:grid; place-items:center; font-size:38px; color:#fff;
    box-shadow:0 12px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size:20px; font-weight:800; letter-spacing:.4px; margin-bottom:8px; }
  .hint { font-size:13px; color:var(--dim); line-height:1.7; margin-bottom:6px; }
  .steps { display:none; flex-direction:column; gap:8px; margin:14px 0 12px; text-align:left; }
  .step {
    font-size:12.5px; line-height:1.65; color:var(--dim);
    background:rgba(255,255,255,0.04); border:1px solid var(--stroke);
    border-radius:12px; padding:10px 12px;
  }
  .step b { display:block; color:var(--text); font-size:12px; margin-bottom:2px; }
  .note { display:none; font-size:12px; color:var(--faint); margin:4px 0 16px; }
  .actions { display:flex; flex-direction:column; gap:9px; margin-top:8px; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    min-height:46px; border-radius:13px; font-size:14px; font-weight:700;
    text-decoration:none; border:1px solid var(--stroke); color:var(--text);
    background:rgba(255,255,255,0.04); font-family:inherit; cursor:pointer;
  }
  .btn.primary { border:none; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 8px 22px rgba(79,124,255,0.35); }
  .spinner {
    width:34px; height:34px; margin:0 auto 18px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.15); border-top-color:var(--accent);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .tips { margin-top:14px; font-size:11.5px; color:var(--faint); line-height:1.7; }
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← 返回「没啥用」</a>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <div class="icon" id="icon" style="display:none">📱</div>
    <h1 id="title">正在打开…</h1>
    <p class="hint" id="hint">正在尝试唤起应用，请稍候…</p>
    <div class="steps" id="steps"></div>
    <div class="note" id="note">有可能没有开放权限哦</div>
    <div class="actions" id="actions"></div>
    <div class="tips" id="tips">若长时间无反应，请返回后重试，或确认已安装对应应用。</div>
  </div>
</main>
<script>
const APPS = {
  tmall: {
    name: "天猫校园", icon: "🛒", bg: "linear-gradient(135deg,#fbbf24,#f59e0b)",
    pkg: "com.tmall.campus.and", schemes: ["tmall://", "taobao://"], web: "https://www.tmall.com"
  },
  shandong: {
    name: "闪动校园Pro", icon: "🏃", bg: "linear-gradient(135deg,#fb7185,#f43f5e)",
    pkg: "com.huachenjie.shandong_school_pro", schemes: ["shandongsport://", "shandong://"]
  },
  yuketang: {
    name: "雨课堂", icon: "🌧️", bg: "linear-gradient(135deg,#60a5fa,#3b82f6)",
    schemes: ["yuketang://"], web: "https://www.yuketang.cn/bindmobile/download/app"
  },
  cainiao: {
    name: "菜鸟驿站身份码", icon: "📦", bg: "linear-gradient(135deg,#0ea5e9,#2563eb)",
    pkg: "com.cainiao.wireless", schemes: ["cainiao://", "taobao://"], web: "https://www.taobao.com"
  },
  weixin: {
    name: "微信扫一扫", icon: "📷", bg: "linear-gradient(135deg,#22c55e,#16a34a)",
    pkg: "com.tencent.mm", schemes: ["weixin://scanqrcode"]
  },
  alipay: {
    name: "支付宝付款", icon: "💰", bg: "linear-gradient(135deg,#1677ff,#0958d9)",
    pkg: "com.eg.android.AlipayGphone", schemes: ["alipay://platformapi/startapp?appId=20000056"]
  }
};

const params = new URLSearchParams(location.search);
const key = params.get("app") || "tmall";
const app = APPS[key] || APPS.tmall;
const isAndroid = /Android/i.test(navigator.userAgent);
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const isMobile = isAndroid || isIOS;

const $ = id => document.getElementById(id);
$("icon").textContent = app.icon;
$("icon").style.background = app.bg;
$("title").textContent = "正在打开「" + app.name + "」…";
if (params.get("fail") === "1") { showFail(); }

function showFail() {
  $("spinner").style.display = "none";
  $("icon").style.display = "grid";
  $("title").textContent = "无法打开「" + app.name + "」";
  $("hint").style.display = "none";
  $("steps").style.display = "flex";
  $("steps").innerHTML = isMobile
    ? `<div class="step"><b>Android</b>设置 → 应用 → 浏览器 → 默认打开 → 打开支持的链接 → 允许</div>
       <div class="step"><b>iPhone</b>用 Safari 打开本页后再点一次；如弹出提示请选择「打开」</div>`
    : `<div class="step"><b>请在手机上打开</b>快捷跳转只在手机浏览器中生效</div>`;
  $("note").style.display = "block";
  $("tips").style.display = isMobile ? "block" : "none";
  let html = "";
  if (app.web) html += `<a class="btn primary" href="${app.web}" target="_blank" rel="noopener">打开网页版</a>`;
  html += `<button class="btn ghost" id="retry">再试一次</button>`;
  html += `<a class="btn ghost" href="index.html">返回</a>`;
  $("actions").innerHTML = html;
  const r = $("retry");
  if (r) r.addEventListener("click", () => { location.href = "jump.html?app=" + key; });
}

function fire(scheme) {
  try {
    const a = document.createElement("a");
    a.href = scheme;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (e) {}
}

function attempt(scheme) {
  return new Promise(resolve => {
    let left = false;
    const onVis = () => { if (document.hidden) left = true; };
    document.addEventListener("visibilitychange", onVis);
    fire(scheme);
    setTimeout(() => {
      document.removeEventListener("visibilitychange", onVis);
      resolve(!left && !document.hidden);
    }, 800);
  });
}

async function go() {
  if (!isMobile) { showFail(); return; }
  if (isAndroid && app.pkg) {
    const back = location.origin + location.pathname + "?app=" + encodeURIComponent(key) + "&fail=1";
    const intent = "intent://#Intent;package=" + app.pkg + ";S.browser_fallback_url=" + encodeURIComponent(back) + ";end";
    try { location.href = intent; } catch (e) {}
    setTimeout(() => { if (document.visibilityState === "visible") showFail(); }, 2600);
    return;
  }
  for (const s of (app.schemes || [])) {
    const failed = await attempt(s);
    if (!failed) return;
  }
  showFail();
}

go();
</script>
</body>
</html>
